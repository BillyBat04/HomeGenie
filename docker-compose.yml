
version: '3.8'

services:

  # PostgreSQL Database (Free & Local)
  postgres:
    image: postgres:15-alpine
    container_name: homegenie-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-databases.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - homegenie-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache (Local - Upstash Alternative)
  # Production: Use Upstash Redis (FREE: 10K commands/day)
  redis:
    image: redis:7-alpine
    container_name: homegenie-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis123}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - homegenie-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: homegenie-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - homegenie-network
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_logs:/var/lib/zookeeper/log

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: homegenie-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - homegenie-network
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 30s
      timeout: 10s
      retries: 5


  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: homegenie-kafka-ui
    depends_on:
      - kafka
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: homegenie-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9093
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    networks:
      - homegenie-network

  # Kafka Lag Exporter (Consumer Lag Monitoring)
  kafka-lag-exporter:
    image: seglo/kafka-lag-exporter:0.8.2
    container_name: homegenie-kafka-lag-exporter
    ports:
      - "9999:9999"
    volumes:
      - ./kafka-lag-exporter/application.conf:/opt/docker/conf/application.conf:ro
    depends_on:
      - kafka
    networks:
      - homegenie-network
    restart: unless-stopped

  # Prometheus (Metrics Collection)
  prometheus:
    image: prom/prometheus:latest
    container_name: homegenie-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - homegenie-network
    restart: unless-stopped

  # =====================================================
  # Grafana (Metrics Visualization)
  # FREE & Open Source
  # =====================================================
  grafana:
    image: grafana/grafana:latest
    container_name: homegenie-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_INSTALL_PLUGINS: redis-datasource
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    networks:
      - homegenie-network
    depends_on:
      - prometheus
    restart: unless-stopped
  # PgAdmin (PostgreSQL Management UI)

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: homegenie-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@homegenie.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - homegenie-network
    depends_on:
      - postgres
    restart: unless-stopped

# Networks
networks:
  homegenie-network:
    driver: bridge
    name: homegenie-network
# Volumes (Persistent Data)

volumes:
  postgres_data:
    name: homegenie-postgres-data
  redis_data:
    name: homegenie-redis-data
  kafka_data:
    name: homegenie-kafka-data
  zookeeper_data:
    name: homegenie-zookeeper-data
  zookeeper_logs:
    name: homegenie-zookeeper-logs
  prometheus_data:
    name: homegenie-prometheus-data
  grafana_data:
    name: homegenie-grafana-data
  pgadmin_data:
    name: homegenie-pgadmin-data

# =====================================================
#
# Access URLs:
#   API Gateway:   http://localhost:8080 (MAIN ENTRY POINT)
#   User Service:  http://localhost:8081 (via Gateway)
#   Maintenance:   http://localhost:8082 (via Gateway)
#   Payment:       http://localhost:8083 (via Gateway)
#   Notification:  http://localhost:8084 (via Gateway)
#   PostgreSQL:    localhost:5432
#   Redis:         localhost:6379
#   Kafka:         localhost:9092
#   Kafka UI:      http://localhost:8090
#   Prometheus:    http://localhost:9090
#   Grafana:       http://localhost:3000
#   PgAdmin:       http://localhost:5050
#
# Credentials:
#   PostgreSQL:    postgres / (set in .env)
#   Redis:         password: redis123
#   Grafana:       admin / admin
#   PgAdmin:       admin@homegenie.com / admin
# =====================================================
