server:
  port: 8080

spring:
  application:
    name: gateway-service

  codec:
    max-in-memory-size: 1MB

  # JWT validation — gateway validates tokens using identity-service's JWKS (RS256)
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${IDENTITY_SERVICE_URL:http://identity-service:8086}/.well-known/jwks.json

gateway:
  public-routes:
    - /api/users/register
    - /api/users/login
    - /actuator/health/**
    - /actuator/info
    - /fallback/**

  # HTTP-Basic credentials protecting Actuator endpoints
  actuator:
    username: ${ACTUATOR_USERNAME:admin}
    password: ${ACTUATOR_PASSWORD:}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms

  cloud:
    gateway:
      httpclient:
        max-header-size: 32KB
      routes:
        - id: user-service-auth
          uri: ${IDENTITY_SERVICE_URL:http://identity-service:8086}
          predicates:
            - Path=/api/auth/**
          filters:
            - RewritePath=/api/auth/(?<segment>.*), /platform/identity/v1/${segment}
            - name: CircuitBreaker
              args:
                name: identity-service
                fallbackUri: forward:/fallback/identity-service
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                key-resolver: "#{@userKeyResolver}"

        - id: user-service
          uri: ${USER_SERVICE_URL:http://user-service:8081}
          predicates:
            - Path=/api/users/**
          filters:
            - name: CircuitBreaker
              args:
                name: user-service
                fallbackUri: forward:/fallback/user-service
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                key-resolver: "#{@userKeyResolver}"

        - id: maintenance-service
          uri: ${MAINTENANCE_SERVICE_URL:http://maintenance-service:8082}
          predicates:
            - Path=/api/maintenance/**
          filters:
            - name: CircuitBreaker
              args:
                name: maintenance-service
                fallbackUri: forward:/fallback/maintenance-service
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                key-resolver: "#{@userKeyResolver}"

        - id: payment-service-payments
          uri: ${PAYMENT_SERVICE_URL:http://payment-service:8083}
          predicates:
            - Path=/api/payments/**
          filters:
            - name: CircuitBreaker
              args:
                name: payment-service
                fallbackUri: forward:/fallback/payment-service
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                key-resolver: "#{@userKeyResolver}"

        - id: payment-service-wallet
          uri: ${PAYMENT_SERVICE_URL:http://payment-service:8083}
          predicates:
            - Path=/api/wallet/**
          filters:
            - name: CircuitBreaker
              args:
                name: payment-service
                fallbackUri: forward:/fallback/payment-service
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                key-resolver: "#{@userKeyResolver}"

        - id: payment-service-invoices
          uri: ${PAYMENT_SERVICE_URL:http://payment-service:8083}
          predicates:
            - Path=/api/invoices/**
          filters:
            - name: CircuitBreaker
              args:
                name: payment-service
                fallbackUri: forward:/fallback/payment-service
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                key-resolver: "#{@userKeyResolver}"

        - id: notification-service
          uri: ${NOTIFICATION_SERVICE_URL:http://notification-service:8084}
          predicates:
            - Path=/api/notifications/**
          filters:
            - name: CircuitBreaker
              args:
                name: notification-service
                fallbackUri: forward:/fallback/notification-service
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                key-resolver: "#{@userKeyResolver}"

        - id: identity-platform-service
          uri: ${IDENTITY_SERVICE_URL:http://identity-service:8086}
          predicates:
            - Path=/platform/identity/v1/**
          filters:
            - name: CircuitBreaker
              args:
                name: identity-service
                fallbackUri: forward:/fallback/identity-service
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                key-resolver: "#{@userKeyResolver}"

      # Global CORS Configuration
      globalcors:
        cors-configurations:
          "[/**]":
            allowedOrigins:
              - "http://localhost:5173"
              - "http://localhost:3000"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600

# Platform Feature Flags (Phase 2+)
platform:
  # Shadow Mode Configuration (Phase 2) - NOW DISABLED
  shadow-mode:
    enabled: false # ✅ DISABLED - Phase 2 complete, moving to Phase 3
    log-mismatches: true
    alert-on-mismatch: false
    timeout-seconds: 5

  # Traffic Split Configuration (Phase 3) - NOW ENABLED
  traffic-split:
    enabled: true # ✅ ENABLED - Starting Phase 3 with 5% traffic
    percentage: 5 # 🎯 Week 1: 5% traffic to Identity Service

  # Auto-Rollback Configuration
  auto-rollback:
    enabled: true
    error-rate-threshold: 1.0 # Rollback if error rate > 1%
    response-time-threshold: 200 # Rollback if p95 > 200ms
    check-interval-seconds: 60
    min-requests: 100 # Min requests before calculating error rate

  # Service URLs
  identity-service:
    url: ${IDENTITY_SERVICE_URL:http://identity-service:8086}
  user-service:
    url: ${USER_SERVICE_URL:http://user-service:8081}

resilience4j:
  circuitbreaker:
    instances:
      user-service:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        slow-call-duration-threshold: 3s
        slow-call-rate-threshold: 80
      maintenance-service:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        slow-call-duration-threshold: 3s
        slow-call-rate-threshold: 80
      payment-service:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        slow-call-duration-threshold: 3s
        slow-call-rate-threshold: 80
      notification-service:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        slow-call-duration-threshold: 3s
        slow-call-rate-threshold: 80
      identity-service:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        slow-call-duration-threshold: 3s
        slow-call-rate-threshold: 80
  timelimiter:
    instances:
      user-service:
        timeout-duration: 5s
      maintenance-service:
        timeout-duration: 5s
      payment-service:
        timeout-duration: 5s
      notification-service:
        timeout-duration: 5s
      identity-service:
        timeout-duration: 5s

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized # Only show details to authenticated users
      probes:
        enabled: true
  health:
    redis:
      enabled: false # Disable Redis health check - not a critical Gateway dependency
  metrics:
    tags:
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true

# Mini-App Configuration (Phase A4)
mini-apps:
  apps:
    - id: maintenance
      name: Maintenance Request Management
      enabled: true
      description: Home maintenance and repair request tracking
      routes:
        - /api/maintenance/**
    - id: marketplace
      name: Service Marketplace
      enabled: true
      description: External service provider marketplace
      routes:
        - /api/marketplace/**
    - id: booking
      name: Appointment Booking
      enabled: false # Future implementation
      description: Appointment scheduling for all services
      routes:
        - /api/booking/**

# Logging Configuration
logging:
  level:
    root: INFO
    com.homegenie.gateway: DEBUG
    org.springframework.cloud.gateway: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n"
