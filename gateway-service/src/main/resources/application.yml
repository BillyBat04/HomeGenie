server:
  port: 8080

spring:
  application:
    name: gateway-service

  # Redis Configuration (for Rate Limiting)
  redis:
    host: localhost
    port: 6379
    password: redis123
    timeout: 2000ms

  cloud:
    gateway:
      # Route Definitions
      routes:
        # User Service Routes - Authentication (public endpoints)
        - id: user-service-auth
          uri: http://localhost:8081
          predicates:
            - Path=/api/auth/**
          filters:
            - ShadowModeFilter # Phase 2: Shadow mode for authentication
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                key-resolver: "#{@userKeyResolver}"

        # User Service Routes - User Management (protected endpoints)
        - id: user-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/users/**
          filters:
            - JwtAuthenticationFilter
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                key-resolver: "#{@userKeyResolver}"

        # Maintenance Service Routes
        - id: maintenance-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/maintenance/**
          filters:
            - JwtAuthenticationFilter
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                key-resolver: "#{@userKeyResolver}"

        # Payment Service Routes - Payments
        - id: payment-service-payments
          uri: http://localhost:8083
          predicates:
            - Path=/api/payments/**
          filters:
            - JwtAuthenticationFilter
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                key-resolver: "#{@userKeyResolver}"

        # Payment Service Routes - Wallet
        - id: payment-service-wallet
          uri: http://localhost:8083
          predicates:
            - Path=/api/wallet/**
          filters:
            - JwtAuthenticationFilter
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                key-resolver: "#{@userKeyResolver}"

        # Payment Service Routes - Invoices
        - id: payment-service-invoices
          uri: http://localhost:8083
          predicates:
            - Path=/api/invoices/**
          filters:
            - JwtAuthenticationFilter
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                key-resolver: "#{@userKeyResolver}"

        # Notification Service Routes
        - id: notification-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/notifications/**
          filters:
            - JwtAuthenticationFilter
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                key-resolver: "#{@userKeyResolver}"

        # Identity Platform Service Routes (Phase 2 - Shadow Mode)
        - id: identity-platform-service
          uri: http://localhost:8086
          predicates:
            - Path=/platform/identity/v1/**
          filters:
            - JwtAuthenticationFilter
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                key-resolver: "#{@userKeyResolver}"

      # Global CORS Configuration
      globalcors:
        cors-configurations:
          "[/**]":
            allowedOrigins:
              - "http://localhost:5173"
              - "http://localhost:3000"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600

# JWT Configuration (must match User Service)
jwt:
  secret: ${JWT_SECRET:your-secret-key-must-be-at-least-256-bits-long-for-HS256-algorithm}
  expiration: 86400000 # 24 hours

# Platform Feature Flags (Phase 2+)
platform:
  # Shadow Mode Configuration (Phase 2) - NOW DISABLED
  shadow-mode:
    enabled: false # ✅ DISABLED - Phase 2 complete, moving to Phase 3
    log-mismatches: true
    alert-on-mismatch: false
    timeout-seconds: 5

  # Traffic Split Configuration (Phase 3) - NOW ENABLED
  traffic-split:
    enabled: true # ✅ ENABLED - Starting Phase 3 with 5% traffic
    percentage: 5 # 🎯 Week 1: 5% traffic to Identity Service

  # Auto-Rollback Configuration
  auto-rollback:
    enabled: true
    error-rate-threshold: 1.0 # Rollback if error rate > 1%
    response-time-threshold: 200 # Rollback if p95 > 200ms
    check-interval-seconds: 60
    min-requests: 100 # Min requests before calculating error rate

  # Service URLs
  identity-service:
    url: http://localhost:8086
  user-service:
    url: http://localhost:8081

# Actuator Configuration
management:
  actuator:
    username: ${ACTUATOR_USERNAME:admin}
    password: ${ACTUATOR_PASSWORD:changeme}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized # Only show details to authenticated users
      probes:
        enabled: true
  health:
    redis:
      enabled: false # Disable Redis health check - not a critical Gateway dependency
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}

# Mini-App Configuration (Phase A4)
mini-apps:
  apps:
    - id: maintenance
      name: Maintenance Request Management
      enabled: true
      description: Home maintenance and repair request tracking
      routes:
        - /api/maintenance/**
    - id: marketplace
      name: Service Marketplace
      enabled: true
      description: External service provider marketplace
      routes:
        - /api/marketplace/**
    - id: booking
      name: Appointment Booking
      enabled: false # Future implementation
      description: Appointment scheduling for all services
      routes:
        - /api/booking/**

# Logging Configuration
logging:
  level:
    root: INFO
    com.homegenie.gateway: DEBUG
    org.springframework.cloud.gateway: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n"
