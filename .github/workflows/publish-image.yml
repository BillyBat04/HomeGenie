

name: Publish Image (Reusable)

on:
  workflow_call:
    inputs:
      service:
        description: "Service directory name"
        required: true
        type: string
      tag:
        description: "Image tag (e.g., 1.0.0, main, pr-123)"
        required: true
        type: string
      push:
        description: "Push image to registry (default: true)"
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  build-and-push:
    name: Build and Push ${{ inputs.service }}
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📥 Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.service }}-jar
          path: ./${{ inputs.service }}/target

      - name: ☕ Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "maven"

      - name: 🔐 Login to GitHub Container Registry
        if: ${{ inputs.push }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 📝 Extract metadata
        id: meta
        run: |
          echo "image=ghcr.io/${{ github.repository_owner }}/${{ inputs.service }}" >> $GITHUB_OUTPUT
          echo "full_tag=ghcr.io/${{ github.repository_owner }}/${{ inputs.service }}:${{ inputs.tag }}" >> $GITHUB_OUTPUT

      - name: 🐳 Build and push with Jib
        working-directory: ./${{ inputs.service }}
        env:
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          if [ "${{ inputs.push }}" = "true" ]; then
            mvn -B -ntp compile jib:build \
              -Djib.to.image=${{ steps.meta.outputs.full_tag }} \
              -Djib.to.auth.username=${{ github.actor }} \
              -Djib.to.auth.password=${{ secrets.GITHUB_TOKEN }}
          else
            mvn -B -ntp compile jib:buildTar \
              -Djib.to.image=${{ steps.meta.outputs.full_tag }}
          fi

      - name: 📋 Generate SBOM with Syft
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.meta.outputs.full_tag }}
          format: spdx-json
          output-file: sbom-${{ inputs.service }}.spdx.json

      - name: 📤 Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ inputs.service }}
          path: sbom-${{ inputs.service }}.spdx.json
          retention-days: 90

      - name: 🔍 Vulnerability scan with Trivy
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ steps.meta.outputs.full_tag }}
          format: "sarif"
          output: "trivy-results-${{ inputs.service }}.sarif"
          severity: "CRITICAL,HIGH"

      - name: 📤 Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: "trivy-results-${{ inputs.service }}.sarif"
          category: "trivy-${{ inputs.service }}"

      - name: 🛡️ Install Cosign
        if: ${{ inputs.push }}
        uses: sigstore/cosign-installer@v3

      - name: ✍️ Sign image with Cosign (keyless)
        if: ${{ inputs.push }}
        run: |
          cosign sign --yes ${{ steps.meta.outputs.full_tag }}

      - name: ✅ Verify image signature
        if: ${{ inputs.push }}
        run: |
          cosign verify ${{ steps.meta.outputs.full_tag }} \
            --certificate-identity-regexp="https://github.com/${{ github.repository_owner }}.*" \
            --certificate-oidc-issuer=https://token.actions.githubusercontent.com

      - name: 📊 Image summary
        run: |
          echo "### 🐳 Container Image Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Service:** \`${{ inputs.service }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${{ steps.meta.outputs.full_tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Signed:** ✅ Cosign keyless signature" >> $GITHUB_STEP_SUMMARY
          echo "**SBOM:** ✅ SPDX format" >> $GITHUB_STEP_SUMMARY
          echo "**Scan:** ✅ Trivy vulnerability scan" >> $GITHUB_STEP_SUMMARY
