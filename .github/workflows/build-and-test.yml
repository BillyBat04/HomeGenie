# ===================================================================
# Reusable Workflow: Build and Test Java Service
# ===================================================================
# This workflow builds a Java microservice, runs tests, and uploads
# the built JAR as an artifact for downstream jobs.
#
# Usage:
#   jobs:
#     build:
#       uses: ./.github/workflows/build-and-test.yml
#       with:
#         service: userservice
#         skipTests: false
# ===================================================================

name: Build and Test (Reusable)

on:
  workflow_call:
    inputs:
      service:
        description: "Service directory name (e.g., userservice, maintenanceservice)"
        required: true
        type: string
      skipTests:
        description: "Skip running unit tests (default: false)"
        required: false
        type: boolean
        default: false

jobs:
  build:
    name: Build ${{ inputs.service }}
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ☕ Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "maven"

      - name: 📦 Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-

      - name: 🔨 Build JAR
        working-directory: ./${{ inputs.service }}
        run: mvn -B -ntp clean package -DskipTests=${{ inputs.skipTests }}

      - name: 🧪 Run unit tests
        if: ${{ !inputs.skipTests }}
        working-directory: ./${{ inputs.service }}
        run: mvn -B -ntp test

      - name: 📊 Generate test report
        if: ${{ !inputs.skipTests && always() }}
        uses: dorny/test-reporter@v1
        with:
          name: Test Results - ${{ inputs.service }}
          path: ${{ inputs.service }}/target/surefire-reports/*.xml
          reporter: java-junit
          fail-on-error: false

      - name: 📤 Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.service }}-jar
          path: ./${{ inputs.service }}/target/*.jar
          retention-days: 7
