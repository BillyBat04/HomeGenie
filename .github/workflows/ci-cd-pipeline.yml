# ===================================================================
# CI/CD Pipeline for HomeGenie Microservices
# ===================================================================
# This workflow orchestrates the complete CI/CD pipeline:
# 1. Build & test all 5 microservices + frontend
# 2. Run security scans and quality checks
# 3. Build and push container images with SBOM & signing
# 4. Deploy to target environment
#
# Triggers:
#   - Push to main/develop branches
#   - Pull requests
#   - Manual dispatch
# ===================================================================

name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      deploy_env:
        description: "Deployment environment"
        required: true
        type: choice
        options:
          - none
          - dev
          - staging
          - production
permissions:
    contents: read
    packages: write
    security-events: write
    id-token: write


env:
  REGISTRY: ghcr.io
  IMAGE_TAG: ${{ github.sha }}

jobs:
  # ============================================================
  # Stage 1: Build and Test Backend Services
  # ============================================================
  build-backend:
    name: Build Backend
    strategy:
      matrix:
        service:
          [
            gateway-service,
            userservice,
            maintenanceservice,
            paymentservice,
            notificationservice,
          ]
    uses: ./.github/workflows/build-and-test.yml
    with:
      service: ${{ matrix.service }}
      skipTests: false

  # ============================================================
  # Stage 2: Build Frontend
  # ============================================================
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: homegenie-app/package-lock.json

      - name: 📦 Install dependencies
        working-directory: ./homegenie-app
        run: npm ci

      - name: 🧪 Run tests
        working-directory: ./homegenie-app
        run: npm test -- --run

      - name: 🏗️ Build production bundle
        working-directory: ./homegenie-app
        run: npm run build

      - name: 📤 Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: ./homegenie-app/dist
          retention-days: 7

  # ============================================================
  # Stage 3: Security Scanning
  # ============================================================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [build-backend]
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔍 Run CodeQL analysis
        uses: github/codeql-action/init@v3
        with:
          languages: java, javascript

      - name: 🔍 Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3

      - name: 🔒 OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: "HomeGenie"
          path: "."
          format: "HTML"
          args: >
            --enableRetired
            --failOnCVSS 7

      - name: 📤 Upload dependency check results
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: reports

  # ============================================================
  # Stage 4: Code Quality
  # ============================================================
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    needs: [build-backend]
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📊 SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=${{ github.repository_owner }}
            -Dsonar.projectKey=${{ github.repository_owner }}_homegenie

  # ============================================================
  # Stage 5: Build and Push Container Images
  # ============================================================
  publish-images:
    name: Publish Images
    needs: [build-backend, security-scan]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    strategy:
      matrix:
        service:
          [
            gateway-service,
            userservice,
            maintenanceservice,
            paymentservice,
            notificationservice,
          ]
    uses: ./.github/workflows/publish-image.yml
    with:
      service: ${{ matrix.service }}
      tag: ${{ github.sha }}
      push: true
    secrets: inherit

  # ============================================================
  # Stage 6: Database Migrations
  # ============================================================
  database-migrations:
    name: Database Migrations
    runs-on: ubuntu-latest
    needs: [publish-images]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      matrix:
        service:
          [userservice, maintenanceservice, paymentservice, notificationservice]
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ☕ Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: 🗄️ Run Flyway migrations
        working-directory: ./${{ matrix.service }}
        env:
          DB_URL: ${{ secrets[format('{0}_DB_URL', matrix.service)] }}
          DB_USER: ${{ secrets[format('{0}_DB_USER', matrix.service)] }}
          DB_PASSWORD: ${{ secrets[format('{0}_DB_PASSWORD', matrix.service)] }}
        run: |
          mvn -B flyway:migrate \
            -Dflyway.url="$DB_URL" \
            -Dflyway.user="$DB_USER" \
            -Dflyway.password="$DB_PASSWORD"

  # ============================================================
  # Stage 7: Deploy to Environment
  # ============================================================
  deploy:
    name: Deploy to ${{ github.event.inputs.deploy_env || 'dev' }}
    runs-on: ubuntu-latest
    needs: [publish-images, database-migrations]
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_env != 'none')
    environment:
      name: ${{ github.event.inputs.deploy_env || 'dev' }}
      url: ${{ steps.deploy.outputs.app_url }}
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🚀 Deploy to Railway
        id: deploy
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          # Install Railway CLI
          npm i -g @railway/cli

          # Deploy each service
          railway up --service gateway-service
          railway up --service userservice
          railway up --service maintenanceservice
          railway up --service paymentservice
          railway up --service notificationservice

          # Get deployment URL
          APP_URL=$(railway domain)
          echo "app_url=$APP_URL" >> $GITHUB_OUTPUT

      - name: 🧪 Smoke tests
        run: |
          echo "Running smoke tests against deployment..."
          # Add smoke test commands here

  # ============================================================
  # Stage 8: Notification
  # ============================================================
  notify:
    name: Notify Deployment
    runs-on: ubuntu-latest
    needs: [deploy]
    if: always()
    steps:
      - name: 📧 Send notification
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: |
            Deployment ${{ job.status }}
            Commit: ${{ github.sha }}
            Author: ${{ github.actor }}
            Environment: ${{ github.event.inputs.deploy_env || 'dev' }}
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
        if: always()
