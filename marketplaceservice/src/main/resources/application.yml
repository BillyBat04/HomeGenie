spring:
  application:
    name: marketplace-service

  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/homegenie_marketplace}
    username: ${POSTGRES_USERNAME:postgres}
    password: ${POSTGRES_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false

  security:
    oauth2:
      resourceserver:
        jwt:
          # RSA public key fetched automatically from identity-service JWKS endpoint.
          # No shared secret needed. Supports key rotation without service restarts.
          jwk-set-uri: ${IDENTITY_SERVICE_URL:http://identity-service:8086}/.well-known/jwks.json

server:
  port: 8085
  error:
    include-message: always
    include-binding-errors: always

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
      mini_app: marketplace

# Springdoc OpenAPI Configuration
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    tags-sorter: alpha
    operations-sorter: alpha

# External Service URLs
external-services:
  payment-service:
    url: ${PAYMENT_SERVICE_URL:http://payment-service:8083}
    timeout: 10000
  notification-service:
    url: ${NOTIFICATION_SERVICE_URL:http://notification-service:8084}
    timeout: 10000
  user-service:
    url: ${USER_SERVICE_URL:http://user-service:8081}
    timeout: 10000

# Mini-App Configuration
marketplace:
  mini-app-id: marketplace
  commission-rate: 0.15

logging:
  level:
    root: INFO
    com.homegenie.marketplaceservice: DEBUG
    org.springframework.kafka: INFO
    org.flywaydb: INFO
