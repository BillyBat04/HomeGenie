---
# KEDA ScaledObject for Notification Service
# Scales based on Kafka consumer lag
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: notification-service-kafka-scaler
  namespace: homegenie
spec:
  scaleTargetRef:
    name: notification-service
  minReplicaCount: 2
  maxReplicaCount: 20
  pollingInterval: 10
  cooldownPeriod: 120
  advanced:
    restoreToOriginalReplicaCount: false
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 300
          policies:
            - type: Percent
              value: 50
              periodSeconds: 60
            - type: Pods
              value: 2
              periodSeconds: 60
          selectPolicy: Min
        scaleUp:
          stabilizationWindowSeconds: 30
          policies:
            - type: Percent
              value: 100
              periodSeconds: 30
            - type: Pods
              value: 5
              periodSeconds: 30
          selectPolicy: Max
  triggers:
    # Trigger 1: payment-events topic
    # notification-service consumes payment-events → PAYMENT_CONFIRMED/FAILED/REFUNDED events
    - type: kafka
      authenticationRef:
        name: kafka-trigger-auth
      metadata:
        bootstrapServers: kafka-service.homegenie.svc.cluster.local:9092
        consumerGroup: notification-service
        topic: payment-events
        lagThreshold: "10"
        offsetResetPolicy: latest
        allowIdleConsumers: "false"
    # Trigger 2: maintenance-reminder topic
    # Published by ItemMaintenanceScheduler when items need servicing
    - type: kafka
      authenticationRef:
        name: kafka-trigger-auth
      metadata:
        bootstrapServers: kafka-service.homegenie.svc.cluster.local:9092
        consumerGroup: notification-service
        topic: maintenance-reminder
        lagThreshold: "10"
        offsetResetPolicy: latest
        allowIdleConsumers: "false"
    # Trigger 3: warranty-reminder topic
    # Published by ItemMaintenanceScheduler when warranty is about to expire
    - type: kafka
      authenticationRef:
        name: kafka-trigger-auth
      metadata:
        bootstrapServers: kafka-service.homegenie.svc.cluster.local:9092
        consumerGroup: notification-service
        topic: warranty-reminder
        lagThreshold: "10"
        offsetResetPolicy: latest
        allowIdleConsumers: "false"
---
# TriggerAuthentication for Kafka (if SASL enabled)
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: kafka-trigger-auth
  namespace: homegenie
spec:
  secretTargetRef:
    - parameter: sasl
      name: kafka-secret
      key: sasl
    - parameter: username
      name: kafka-secret
      key: username
    - parameter: password
      name: kafka-secret
      key: password
