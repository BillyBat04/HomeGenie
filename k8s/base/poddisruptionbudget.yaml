---
# PodDisruptionBudget for Gateway Service
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: gateway-service-pdb
  namespace: homegenie
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: gateway-service
---
# PodDisruptionBudget for User Service
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: user-service-pdb
  namespace: homegenie
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: user-service
---
# PodDisruptionBudget for Maintenance Service
apiVersion: policy/v1
