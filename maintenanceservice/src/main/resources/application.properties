server.port=8082
server.tomcat.connection-timeout=20000
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=10
server.shutdown=graceful

spring.application.name=maintenance-service

# Enable Virtual Threads (Java 21)
spring.threads.virtual.enabled=true

# Flyway configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.table=flyway_schema_history

spring.datasource.url=${POSTGRES_URL:jdbc:postgresql://localhost:5432/homegenie_maintenance}
spring.datasource.username=${POSTGRES_USERNAME:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool Configuration
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.connection-test-query=SELECT 1

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Disable mail health check (email not needed)
management.health.mail.enabled=false

email.provider=${EMAIL_PROVIDER:smtp}

# SMTP Settings
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

aws.access-key=${AWS_ACCESS_KEY:}
aws.secret-key=${AWS_SECRET_KEY:}
aws.region=${AWS_REGION:us-east-1}
aws.ses.from-email=${AWS_SES_FROM_EMAIL:no-reply@homegenie.com}
aws.s3.bucket-name=${AWS_S3_BUCKET_NAME:homegenie-uploads-tushar}

huggingface.api.token=${HUGGINGFACE_API_TOKEN:}

logging.level.com.homegenie=${LOGGING_LEVEL:DEBUG}

admin.email=${ADMIN_EMAIL:admin@homegenie.com}
user.service.url=${USER_SERVICE_URL:http://localhost:8081}

# Kafka Configuration
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false

kafka.topics.maintenance-events=maintenance-events

voice.service.url=${VOICE_SERVICE_URL:http://localhost:8000}

voice.assistant.enabled=${VOICE_ASSISTANT_ENABLED:true}
voice.assistant.timeout=${VOICE_ASSISTANT_TIMEOUT:30000}
voice.assistant.max-retries=${VOICE_ASSISTANT_MAX_RETRIES:3}


ai.provider=gemini
ai.gemini.key=${GEMINI_API_KEY:}

voice.features.auto-classification=true
voice.features.emergency-detection=true
voice.features.context-aware=true

# SpringDoc OpenAPI Configuration
springdoc.api-docs.path=/api-docs
springdoc.api-docs.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.show-actuator=false

management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.prometheus.enabled=true
management.metrics.tags.application=${spring.application.name}
management.metrics.tags.version=1.0.0
management.metrics.tags.environment=${ENVIRONMENT:local}