server:
  port: 8084
  tomcat:
    connection-timeout: 20000
    threads:
      max: 200
      min-spare: 10
  shutdown: graceful

spring:
  application:
    name: notification-service

  # Enable Virtual Threads (Java 21 Feature)
  threads:
    virtual:
      enabled: true

  # Database Configuration
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:homegenie_notifications}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000

  # Flyway database migrations
  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: true
    locations: classpath:db/migration
    table: flyway_schema_history

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        "[format_sql]": true

  # Email Configuration (SMTP)
  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
    default-encoding: UTF-8

  # Kafka Configuration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: notification-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

  # JWT validation — public key fetched from identity-service JWKS endpoint (RS256)
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${IDENTITY_SERVICE_URL:http://identity-service:8086}/.well-known/jwks.json

# Email Provider Configuration
email:
  provider: ${EMAIL_PROVIDER:smtp} # smtp or ses
  from: ${EMAIL_FROM:no-reply@homegenie.com}

# AWS Configuration
aws:
  access-key: ${AWS_ACCESS_KEY:}
  secret-key: ${AWS_SECRET_KEY:}
  region: ${AWS_REGION:us-east-1}
  ses:
    from-email: ${AWS_SES_FROM_EMAIL:no-reply@homegenie.com}
  sns:
    enabled: ${AWS_SNS_ENABLED:false}

# Service URLs
services:
  user-service:
    url: ${USER_SERVICE_URL:http://localhost:8081}
  maintenance-service:
    url: ${MAINTENANCE_SERVICE_URL:http://localhost:8082}
  payment-service:
    url: ${PAYMENT_SERVICE_URL:http://localhost:8083}

# Notification Settings
notification:
  retry:
    max-attempts: ${NOTIFICATION_RETRY_MAX_ATTEMPTS:3}
    delay-ms: ${NOTIFICATION_RETRY_DELAY_MS:5000}
  batch:
    size: ${NOTIFICATION_BATCH_SIZE:10}
    interval-ms: ${NOTIFICATION_BATCH_INTERVAL_MS:10000}
  retention:
    days: ${NOTIFICATION_RETENTION_DAYS:90}

# Kafka Topics
kafka:
  topics:
    payment-events: payment-events
    invoice-events: invoice-events
    maintenance-events: maintenance-events
    user-events: user-events
    notification-events: notification-events
    # Dedicated reminder topics published by maintenance-service.
    # These same topics are watched by KEDA ScaledObject for auto-scaling.
    maintenance-reminder: maintenance-reminder
    warranty-reminder: warranty-reminder

# Actuator Configuration (Monitoring)
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
      version: "1.0.0"
  prometheus:
    metrics:
      export:
        enabled: true

# Resilience4j Circuit Breaker
resilience4j:
  circuitbreaker:
    instances:
      userService:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        permitted-number-of-calls-in-half-open-state: 3
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        register-health-indicator: true
  timelimiter:
    instances:
      userService:
        timeout-duration: 5s

# Logging
logging:
  level:
    "[com.homegenie.notificationservice]": INFO
    "[org.springframework.kafka]": INFO
    "[org.springframework.mail]": DEBUG

# SpringDoc OpenAPI Configuration
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  show-actuator: false
