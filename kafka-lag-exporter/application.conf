# Kafka Lag Exporter Configuration
# Monitors consumer group lag for HomeGenie services

kafka-lag-exporter {
  port = 9999
  client-group-id = "kafkalagexporter"
  lookup-table-size = 120
  
  clusters = [
    {
      name = "homegenie-local"
      bootstrap-brokers = "kafka:9093"
      
      # Monitor only groups that actually exist in the codebase.
      # notification-service: subscribes to payment-events, maintenance-events,
      #                        maintenance-reminder, warranty-reminder, user-events
      # (maintenance/payment services are pure producers — they have no consumer groups)
      consumer-groups = [
        "notification-service"
      ]
      
      # Admin client configuration
      admin-client-properties = {
        client.id = "kafkalagexporter-admin"
      }
      
      # Consumer configuration
      consumer-properties = {
        client.id = "kafkalagexporter-consumer"
      }
    }
  ]
  
  # Poll interval for checking consumer lag
  poll-interval = 30 seconds
  
  # Timeout for Kafka operations
  timeout = 10 seconds
  
  # Metrics refresh interval
  metrics-refresh-interval = 30 seconds
}
