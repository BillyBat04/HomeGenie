server:
  port: ${SERVER_PORT:8083}
  tomcat:
    connection-timeout: 20000
    threads:
      max: 200
      min-spare: 10
  shutdown: graceful

spring:
  application:
    name: payment-service

  # Enable Virtual Threads (Java 21)
  threads:
    virtual:
      enabled: true

  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/homegenie_payments}
    username: ${POSTGRES_USERNAME:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000

  # Flyway database migrations
  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: true
    locations: classpath:db/migration
    table: flyway_schema_history

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  # Kafka: publish payment lifecycle events so notification-service sends confirmations
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all          # wait for leader + all in-sync replicas before ack
      retries: 3
      properties:
        spring.json.add.type.headers: false
        enable.idempotence: true     # exactly-once delivery from producer side
        max.in.flight.requests.per.connection: 1

  # JWT validation — public key fetched from identity-service JWKS endpoint (RS256)
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${IDENTITY_SERVICE_URL:http://identity-service:8086}/.well-known/jwks.json

# Stripe Configuration
stripe:
  api-key: ${STRIPE_API_KEY:}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
  currency: ${STRIPE_CURRENCY:usd}

# Service URLs
user:
  service:
    url: ${USER_SERVICE_URL:http://localhost:8081}

maintenance:
  service:
    url: ${MAINTENANCE_SERVICE_URL:http://localhost:8082}

# Payment Configuration
payment:
  minimum-amount: ${PAYMENT_MIN_AMOUNT:100}
  maximum-amount: ${PAYMENT_MAX_AMOUNT:1000000}
  auto-capture: ${PAYMENT_AUTO_CAPTURE:true}
  refund-days: ${PAYMENT_REFUND_DAYS:30}

# Payment Platform Configuration (v2)
payment-platform:
  mini-apps:
    maintenance:
      commission-rate: 0.10
      enabled: true
      display-name: "Maintenance Service"
      description: "Home maintenance and repair services"

    marketplace:
      commission-rate: 0.15
      enabled: false
      display-name: "Marketplace"
      description: "Buy and sell products (future)"

    booking:
      commission-rate: 0.12
      enabled: false
      display-name: "Booking Service"
      description: "Service appointments and bookings (future)"

# Invoice Configuration
invoice:
  prefix: ${INVOICE_PREFIX:INV}
  due-days: ${INVOICE_DUE_DAYS:7}
  late-fee-percentage: ${INVOICE_LATE_FEE:5.0}

kafka:
  topics:
    payment-events: payment-events

# Logging
logging:
  level:
    com.homegenie: ${LOGGING_LEVEL:DEBUG}
    com.stripe: ${STRIPE_LOGGING_LEVEL:INFO}

# Actuator endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
      version: "1.0.0"
      environment: ${ENVIRONMENT:local}

# SpringDoc OpenAPI Configuration
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  show-actuator: false

# Resilience4j Circuit Breaker
resilience4j:
  circuitbreaker:
    instances:
      maintenanceService:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        permitted-number-of-calls-in-half-open-state: 3
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        register-health-indicator: true
  timelimiter:
    instances:
      maintenanceService:
        timeout-duration: 5s
