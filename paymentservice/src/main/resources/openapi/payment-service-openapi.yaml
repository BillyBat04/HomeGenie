openapi: 3.0.1
info:
  title: Payment Service API
  description: |
    Wallet and payment management service with Stripe integration.
    Handles top-up, debit, payment processing, refunds, and invoice generation.
  version: 1.0.0
  contact:
    name: HomeGenie Team
servers:
  - url: http://localhost:8083
    description: Local development
  - url: http://production-url:8083
    description: Production

security:
  - bearerAuth: []

tags:
  - name: Wallet Operations
    description: Wallet creation, balance, and transaction history
  - name: Payment Operations
    description: Payment processing, status updates, and refunds
  - name: Invoice Operations
    description: Invoice generation and retrieval
  - name: Health Check
    description: Service health monitoring

paths:
  # Wallet Operations (6 endpoints)
  /api/payments/wallets/create:
    post:
      tags:
        - Wallet Operations
      summary: Create wallet
      description: Create new wallet for user
      operationId: createWallet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WalletCreateRequest"
      responses:
        "200":
          description: Wallet created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletResponse"

  /api/payments/wallets/{userId}:
    get:
      tags:
        - Wallet Operations
      summary: Get wallet by user ID
      operationId: getWalletByUserId
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          example: 1
      responses:
        "200":
          description: Wallet found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletResponse"

  /api/payments/wallets/{walletId}/topup:
    post:
      tags:
        - Wallet Operations
      summary: Top-up wallet
      description: Add funds to wallet via Stripe
      operationId: topUpWallet
      parameters:
        - name: walletId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TopUpRequest"
      responses:
        "200":
          description: Top-up successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionResponse"

  /api/payments/wallets/{walletId}/debit:
    post:
      tags:
        - Wallet Operations
      summary: Debit from wallet
      description: Deduct funds from wallet for payment
      operationId: debitWallet
      parameters:
        - name: walletId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DebitRequest"
      responses:
        "200":
          description: Debit successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionResponse"

  /api/payments/wallets/{walletId}/balance:
    get:
      tags:
        - Wallet Operations
      summary: Get wallet balance
      operationId: getWalletBalance
      parameters:
        - name: walletId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          example: 1
      responses:
        "200":
          description: Balance retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BalanceResponse"

  /api/payments/wallets/{walletId}/transactions:
    get:
      tags:
        - Wallet Operations
      summary: Get transaction history
      operationId: getTransactionHistory
      parameters:
        - name: walletId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          example: 1
      responses:
        "200":
          description: Transaction history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TransactionResponse"

  # Payment Operations (7 endpoints)
  /api/payments/create:
    post:
      tags:
        - Payment Operations
      summary: Create payment
      description: Create payment for maintenance request
      operationId: createPayment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentCreateRequest"
      responses:
        "200":
          description: Payment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentResponse"

  /api/payments/{paymentId}:
    get:
      tags:
        - Payment Operations
      summary: Get payment by ID
      operationId: getPaymentById
      parameters:
        - name: paymentId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          example: 1
      responses:
        "200":
          description: Payment found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentResponse"

  /api/payments/user/{userId}:
    get:
      tags:
        - Payment Operations
      summary: Get user payments
      operationId: getUserPayments
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          example: 1
      responses:
        "200":
          description: Payments found
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PaymentResponse"

  /api/payments/request/{requestId}:
    get:
      tags:
        - Payment Operations
      summary: Get payments by request ID
      operationId: getPaymentsByRequestId
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          example: 1
      responses:
        "200":
          description: Payments found
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PaymentResponse"

  /api/payments/{paymentId}/status:
    put:
      tags:
        - Payment Operations
      summary: Update payment status
      operationId: updatePaymentStatus
      parameters:
        - name: paymentId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentStatusUpdateRequest"
      responses:
        "200":
          description: Status updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentResponse"

  /api/payments/{paymentId}/refund:
    post:
      tags:
        - Payment Operations
      summary: Refund payment
      description: Process refund for payment
      operationId: refundPayment
      parameters:
        - name: paymentId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefundRequest"
      responses:
        "200":
          description: Refund processed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentResponse"

  /api/payments/request/{requestId}/pending:
    get:
      tags:
        - Payment Operations
      summary: Check pending payment
      description: Check if request has pending payment
      operationId: hasPendingPayment
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          example: 1
      responses:
        "200":
          description: Pending status
          content:
            application/json:
              schema:
                type: boolean
              example: true

  # Invoice Operations (3 endpoints)
  /api/payments/invoices/create:
    post:
      tags:
        - Invoice Operations
      summary: Create invoice
      description: Generate invoice for payment
      operationId: createInvoice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvoiceCreateRequest"
      responses:
        "200":
          description: Invoice created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceResponse"

  /api/payments/invoices/{invoiceId}:
    get:
      tags:
        - Invoice Operations
      summary: Get invoice by ID
      operationId: getInvoiceById
      parameters:
        - name: invoiceId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          example: 1
      responses:
        "200":
          description: Invoice found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceResponse"

  /api/payments/invoices/payment/{paymentId}:
    get:
      tags:
        - Invoice Operations
      summary: Get invoice by payment ID
      operationId: getInvoiceByPaymentId
      parameters:
        - name: paymentId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          example: 1
      responses:
        "200":
          description: Invoice found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceResponse"

  # Health Check (1 endpoint)
  /api/payments/health:
    get:
      tags:
        - Health Check
      summary: Health check
      operationId: healthCheck
      security: []
      responses:
        "200":
          description: Service healthy
          content:
            application/json:
              schema:
                type: string
              example: "Payment Service is running"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    # Wallet Schemas
    WalletCreateRequest:
      type: object
      required:
        - userId
      properties:
        userId:
          type: integer
          format: int64
          example: 1
        initialBalance:
          type: number
          format: double
          example: 0.0

    WalletResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        userId:
          type: integer
          format: int64
          example: 1
        balance:
          type: number
          format: double
          example: 1000000.00
        currency:
          type: string
          example: "VND"
        createdAt:
          type: string
          format: date-time
          example: "2024-01-15T10:30:00"

    TopUpRequest:
      type: object
      required:
        - amount
      properties:
        amount:
          type: number
          format: double
          example: 500000.00
        paymentMethod:
          type: string
          example: "STRIPE"
        stripeToken:
          type: string
          example: "tok_visa"

    DebitRequest:
      type: object
      required:
        - amount
        - description
      properties:
        amount:
          type: number
          format: double
          example: 200000.00
        description:
          type: string
          example: "Payment for maintenance request #1"

    TransactionResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        walletId:
          type: integer
          format: int64
          example: 1
        type:
          type: string
          enum: [CREDIT, DEBIT]
          example: "CREDIT"
        amount:
          type: number
          format: double
          example: 500000.00
        balanceBefore:
          type: number
          format: double
          example: 500000.00
        balanceAfter:
          type: number
          format: double
          example: 1000000.00
        description:
          type: string
          example: "Wallet top-up"
        status:
          type: string
          enum: [PENDING, COMPLETED, FAILED]
          example: "COMPLETED"
        createdAt:
          type: string
          format: date-time
          example: "2024-01-15T10:30:00"

    BalanceResponse:
      type: object
      properties:
        walletId:
          type: integer
          format: int64
          example: 1
        balance:
          type: number
          format: double
          example: 1000000.00
        currency:
          type: string
          example: "VND"

    # Payment Schemas
    PaymentCreateRequest:
      type: object
      required:
        - userId
        - maintenanceRequestId
        - amount
      properties:
        userId:
          type: integer
          format: int64
          example: 1
        maintenanceRequestId:
          type: integer
          format: int64
          example: 1
        amount:
          type: number
          format: double
          example: 500000.00
        description:
          type: string
          example: "Sửa điều hòa"
        paymentMethod:
          type: string
          enum: [WALLET, STRIPE, CASH]
          example: "WALLET"

    PaymentResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        userId:
          type: integer
          format: int64
          example: 1
        maintenanceRequestId:
          type: integer
          format: int64
          example: 1
        amount:
          type: number
          format: double
          example: 500000.00
        status:
          type: string
          enum: [PENDING, PROCESSING, COMPLETED, FAILED, REFUNDED]
          example: "COMPLETED"
        paymentMethod:
          type: string
          enum: [WALLET, STRIPE, CASH]
          example: "WALLET"
        transactionId:
          type: string
          example: "txn_123456789"
        description:
          type: string
          example: "Sửa điều hòa"
        createdAt:
          type: string
          format: date-time
          example: "2024-01-15T10:30:00"
        paidAt:
          type: string
          format: date-time
          nullable: true
          example: "2024-01-15T10:35:00"

    PaymentStatusUpdateRequest:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum: [PENDING, PROCESSING, COMPLETED, FAILED, REFUNDED]
          example: "COMPLETED"

    RefundRequest:
      type: object
      properties:
        reason:
          type: string
          example: "Cancelled maintenance request"
        amount:
          type: number
          format: double
          nullable: true
          description: Partial refund amount (null = full refund)
          example: 250000.00

    # Invoice Schemas
    InvoiceCreateRequest:
      type: object
      required:
        - paymentId
      properties:
        paymentId:
          type: integer
          format: int64
          example: 1
        description:
          type: string
          example: "Hóa đơn sửa điều hòa"
        itemsJson:
          type: string
          description: JSON string of invoice items
          example: '[{"description":"Thay gas R32","quantity":1,"unitPrice":300000.00}]'

    InvoiceResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        paymentId:
          type: integer
          format: int64
          example: 1
        invoiceNumber:
          type: string
          example: "INV-20240115-001"
        totalAmount:
          type: number
          format: double
          example: 500000.00
        taxAmount:
          type: number
          format: double
          example: 50000.00
        description:
          type: string
          example: "Hóa đơn sửa điều hòa"
        itemsJson:
          type: string
          example: '[{"description":"Thay gas R32","quantity":1,"unitPrice":300000.00}]'
        createdAt:
          type: string
          format: date-time
          example: "2024-01-15T10:30:00"
