spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: false

  # Disable Flyway — DDL managed by Hibernate in tests
  flyway:
    enabled: false

  # Disable Kafka
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

  # Stub JWKS URI
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:0/.well-known/jwks.json

# Stripe test key placeholder (not used in unit tests)
stripe:
  api:
    key: sk_test_placeholder_for_unit_tests

management:
  tracing:
    enabled: false
